name: Web CD UAT

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  NODE_VERSION: '18.20.4'
  AZURE_RESOURCE_GROUP: 'rg-hrsm-uat'
  API_URL: ${{ secrets.API_URL }}
  STRIPE_PUBLIC_KEY: ${{ secrets.STRIPE_PUBLIC_KEY }}
  AUTH0_ENABLED: ${{ vars.AUTH0_ENABLED }}
  AUTH0_DOMAIN: ${{ vars.AUTH0_DOMAIN }}
  AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
  AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE }}
  AUTH0_DATABASE_CONNECTION: ${{ vars.AUTH0_DATABASE_CONNECTION }}

jobs:
  deploy-uat:
    name: Build & Deploy to Azure Static Web App (UAT)
    runs-on: ubuntu-latest
    environment: ms-uat
    outputs:
      swa_url: ${{ steps.get-swa-token.outputs.swa_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rewrite environment.uat.ts
        uses: ./.github/actions/rewrite-environment-uat

      - name: Rewrite ngsw-config.json with API URL from secret
        run: |
          cat > ngsw-config.json << EOF
          {
            "\$schema": "./node_modules/@angular/service-worker/config/schema.json",
            "index": "/index.html",
            "assetGroups": [
              {
                "name": "app",
                "installMode": "prefetch",
                "resources": {
                  "files": [
                    "/favicon.ico",
                    "/index.csr.html",
                    "/index.html",
                    "/manifest.webmanifest",
                    "/*.css",
                    "/*.js"
                  ]
                }
              },
              {
                "name": "assets",
                "installMode": "lazy",
                "updateMode": "prefetch",
                "resources": {
                  "files": ["/**/*.(svg|cur|jpg|jpeg|png|apng|webp|avif|gif|otf|ttf|woff|woff2)"]
                }
              }
            ],
            "dataGroups": [
              {
                "name": "api",
                "urls": ["${{ secrets.API_URL }}/**"],
                "cacheConfig": {
                  "strategy": "freshness",
                  "maxSize": 100,
                  "maxAge": "1h",
                  "timeout": "10s"
                }
              }
            ]
          }
          EOF

      - name: Clean build output
        run: rm -rf dist/

      - name: Build Angular app (UAT)
        run: npm run build:uat

      - name: Write routes.json to build output
        run: |
          cat > dist/hiking-rental-store-web/browser/routes.json << EOF
          {
            "routes": [
              {
                "route": "/api/*",
                "allowedRoles": [ "anonymous" ]
              },
              { "route": "/*", "serve": "/index.html" }
            ]
          }
          EOF

      - name: List build output
        run: ls -l dist/hiking-rental-store-web/browser/

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get Static Web App deployment token
        id: get-swa-token
        run: |
          swa_count=$(az staticwebapp list \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "length(@)" -o tsv)

          if [ "$swa_count" = "0" ]; then
            echo "No Static Web App found in resource group: ${{ env.AZURE_RESOURCE_GROUP }}"
            exit 1
          fi

          if [ "$swa_count" != "1" ]; then
            echo "Expected exactly 1 Static Web App in resource group ${{ env.AZURE_RESOURCE_GROUP }}, found: $swa_count"
            echo "Set an explicit name in this workflow if there are multiple apps."
            exit 1
          fi

          swa_name=$(az staticwebapp list \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "[0].name" -o tsv)

          default_hostname=$(az staticwebapp show \
            --name "$swa_name" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "defaultHostname" -o tsv)

          token=$(az staticwebapp secrets list \
            --name "$swa_name" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "properties.apiKey" -o tsv)

          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          echo "swa_url=https://$default_hostname" >> "$GITHUB_OUTPUT"

      - name: Deploy to Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.get-swa-token.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'dist/hiking-rental-store-web/browser'
          skip_app_build: true

  integrate-tests:
    name: Integrate Tests (UAT)
    runs-on: ubuntu-latest
    needs: deploy-uat
    environment: ms-uat
    steps:
      - name: Run web and API integration checks
        run: |
          set -euo pipefail

          WEB_URL="${{ needs.deploy-uat.outputs.swa_url }}"
          API_URL="${{ secrets.API_URL }}"

          if [ -z "$WEB_URL" ]; then
            echo "SWA URL output is empty"
            exit 1
          fi

          if [ -z "$API_URL" ]; then
            echo "API_URL secret is not set"
            exit 1
          fi

          WEB_URL="${WEB_URL%/}"
          API_URL="${API_URL%/}"

          echo "Checking web URL: $WEB_URL"
          HOME_HTML=$(curl -sSf "$WEB_URL/")
          echo "$HOME_HTML" | grep -qi "<html"

          echo "Checking API health URL: $API_URL/health"
          curl -sSf "$API_URL/health" >/dev/null

          echo "Integration checks passed"

      - name: Post integration summary
        if: always()
        run: |
          echo "## Web Integration Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Web URL | ${{ needs.deploy-uat.outputs.swa_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| API URL | ${{ secrets.API_URL }} |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "| Status | Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Status | Failed |" >> $GITHUB_STEP_SUMMARY
          fi
