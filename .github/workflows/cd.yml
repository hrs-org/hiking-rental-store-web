name: Web CD UAT

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  NODE_VERSION: '18.20.4'
  AZURE_RESOURCE_GROUP: 'rg-hrsm-uat'

jobs:
  deploy-uat:
    name: Build & Deploy to Azure Static Web App (UAT)
    runs-on: ubuntu-latest
    environment: ms-uat

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rewrite environment.uat.ts
        run: |
          echo "Using API URL: ${{ secrets.API_URL }}"
          echo "Using Stripe Public Key: ${{ secrets.STRIPE_PUBLIC_KEY }}"
          cat > src/environments/environment.uat.ts << 'EOF'
          export const environment = {
            production: true,
            apiUrl: '${{ secrets.API_URL }}',
            stripePublicKey: '${{ secrets.STRIPE_PUBLIC_KEY }}'
          };
          EOF

      - name: Rewrite ngsw-config.json with API URL from secret
        run: |
          cat > ngsw-config.json << EOF
          {
            "\$schema": "./node_modules/@angular/service-worker/config/schema.json",
            "index": "/index.html",
            "assetGroups": [
              {
                "name": "app",
                "installMode": "prefetch",
                "resources": {
                  "files": [
                    "/favicon.ico",
                    "/index.csr.html",
                    "/index.html",
                    "/manifest.webmanifest",
                    "/*.css",
                    "/*.js"
                  ]
                }
              },
              {
                "name": "assets",
                "installMode": "lazy",
                "updateMode": "prefetch",
                "resources": {
                  "files": ["/**/*.(svg|cur|jpg|jpeg|png|apng|webp|avif|gif|otf|ttf|woff|woff2)"]
                }
              }
            ],
            "dataGroups": [
              {
                "name": "api",
                "urls": ["${{ secrets.API_URL }}/**"],
                "cacheConfig": {
                  "strategy": "freshness",
                  "maxSize": 100,
                  "maxAge": "1h",
                  "timeout": "10s"
                }
              }
            ]
          }
          EOF

      - name: Clean build output
        run: rm -rf dist/

      - name: Build Angular app (UAT)
        run: npm run build:uat

      - name: Write routes.json to build output
        run: |
          cat > dist/hiking-rental-store-web/browser/routes.json << EOF
          {
            "routes": [
              {
                "route": "/api/*",
                "allowedRoles": [ "anonymous" ]
              },
              { "route": "/*", "serve": "/index.html" }
            ]
          }
          EOF

      - name: List build output
        run: ls -l dist/hiking-rental-store-web/browser/

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get Static Web App deployment token
        id: get-swa-token
        run: |
          swa_count=$(az staticwebapp list \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "length(@)" -o tsv)

          if [ "$swa_count" = "0" ]; then
            echo "No Static Web App found in resource group: ${{ env.AZURE_RESOURCE_GROUP }}"
            exit 1
          fi

          if [ "$swa_count" != "1" ]; then
            echo "Expected exactly 1 Static Web App in resource group ${{ env.AZURE_RESOURCE_GROUP }}, found: $swa_count"
            echo "Set an explicit name in this workflow if there are multiple apps."
            exit 1
          fi

          swa_name=$(az staticwebapp list \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "[0].name" -o tsv)

          token=$(az staticwebapp secrets list \
            --name "$swa_name" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "properties.apiKey" -o tsv)

          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Deploy to Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.get-swa-token.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'dist/hiking-rental-store-web/browser'
          skip_app_build: true
