name: Rewrite Angular environment.uat.ts
description: Generate src/environments/environment.uat.ts from CI/CD environment variables.

inputs:
  target-file:
    description: Destination environment file path to generate.
    required: false
    default: src/environments/environment.uat.ts

runs:
  using: composite
  steps:
    - name: Generate environment.uat.ts
      shell: bash
      run: |
        DB_CONNECTION="${AUTH0_DATABASE_CONNECTION:-Username-Password-Authentication}"

        cat > "${{ inputs.target-file }}" <<EOF
        export const environment = {
          production: true,
          apiUrl: '${API_URL}',
          stripePublicKey: '${STRIPE_PUBLIC_KEY}',
          auth0: {
            enabled: '${AUTH0_ENABLED}' === 'true',
            domain: '${AUTH0_DOMAIN}',
            clientId: '${AUTH0_CLIENT_ID}',
            audience: '${AUTH0_AUDIENCE}',
            databaseConnection: '${DB_CONNECTION}',
          },
        };
        EOF
