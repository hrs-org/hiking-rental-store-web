<div class="item-row item-border" (click)="onClick()" (keydown.enter)="onClick()" tabindex="0">
  <div class="order-info">
    <div class="order-title">
      <div class="order-guest-name">{{ order?.guestName }}</div>
      <div class="order-status" ngClass="order-status-{{ order?.status?.toLocaleLowerCase() }}">
        {{ order?.status }}
      </div>
    </div>
    <div class="order-date">
      {{ formatDate(order?.startDate) }} - {{ formatDate(order?.endDate) }}
    </div>
  </div>
  <div style="display: flex; align-items: center; gap: 8px">
    <div class="order-amount">{{ order?.totalAmount | currency }}</div>
    <ng-container *ngIf="order?.status === 'PendingPayment' && countdown">
      <span style="color: #fbbf24; font-weight: 500; min-width: 60px; text-align: center">
        {{ countdown }}
      </span>
    </ng-container>
    <button *ngIf="showDelete" mat-stroked-button color="warn" (click)="onDeleteClick($event)">
      Delete
    </button>
  </div>
</div>
