<div class="main-page">
  <app-pwa-header title="Package Management" [backButtonVisible]="true"></app-pwa-header>
  <div class="content">
    @for (packages of packageList$ | async; track $index) {
      <app-packages [packages]="packages"></app-packages>
    }
  </div>

  <button class="floating-add-button" (click)="onClickAddPackage()">+</button>
</div>
