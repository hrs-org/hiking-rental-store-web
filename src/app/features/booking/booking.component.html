<div class="container">
  @for (item of orderList$ | async; track $index) {
    <app-order-item
      [order]="item"
      [showDelete]="true"
      (orderClick)="handleOrderClick($event)"
      (deleteClick)="deleteOrder($event, true)"
      (countdownEnd)="onCountdownEnd()"
    ></app-order-item>
  }
  @if ((orderList$ | async)?.length === 0) {
    <div>No bookings available.</div>
  }
</div>
